name: NSE price refresh
# Must live at .github/workflows/refresh.yml or GitHub ignores it.
# Step 1 repairs the layout (browser uploads land flat); it is idempotent.
# Then: prices every 15 min while Nairobi is open, plus once after the close.
# The source publishes one table per trading day, so refresh.py exits at once
# when the trading date has not changed. Of ~28 runs a day, one does work.
on:
  schedule:
    - cron: "*/15 6-12 * * 1-5"
    - cron: "30 15 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put the files where they belong
        run: |
          git config user.name "thamani-refresh"
          git config user.email "actions@users.noreply.github.com"
          DATA="counters.json macro.json editorial.json"
          SRC="app.js build.py derive.py refresh.py validate.py test_refresh.py css.txt fonts.txt icons.json"
          SITE="index.html artifact.html"
          moved=0
          mkdir -p data src docs
          for f in $DATA; do if [ -f "$f" ]; then git mv -f "$f" "data/$f"; moved=$((moved+1)); fi; done
          for f in $SRC; do if [ -f "$f" ]; then git mv -f "$f" "src/$f"; moved=$((moved+1)); fi; done
          for f in $SITE; do if [ -f "$f" ]; then git mv -f "$f" "docs/$f"; moved=$((moved+1)); fi; done
          if [ -f refresh.yml ]; then git rm -q -f refresh.yml; echo "removed stray root refresh.yml"; fi
          if [ -f download ]; then git rm -q -f download; echo "removed leftover download file"; fi
          touch docs/.nojekyll && git add docs/.nojekyll
          echo "moved $moved files into place"
          if [ "$moved" -gt 0 ]; then
            git commit -q -m "repair: move files into data/, src/ and docs/"
            git push
            echo "Layout repaired: moved $moved files. Now set Settings - Pages - folder to /docs." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Check the layout
        run: |
          fail=0
          for p in data/counters.json data/macro.json data/editorial.json src/build.py src/derive.py src/refresh.py src/validate.py src/app.js; do
            if [ ! -f "$p" ]; then echo "MISSING $p"; fail=1; fi
          done
          if [ "$fail" = "1" ]; then echo "Layout is wrong; nothing further can run." >&2; exit 1; fi
          echo "layout ok"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet requests pandas lxml
      - name: Test
        run: python src/test_refresh.py
      - name: Fetch today's prices
        run: python src/refresh.py
      - name: Validate before publishing
        run: python src/validate.py
      - name: Rebuild the page
        run: python src/build.py
      - name: Commit only if something changed
        run: |
          git config user.name "thamani-refresh"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "no new trading date at the source - nothing to publish" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          git add data docs
          git commit -q -m "prices refreshed"
          git push
      - name: Report a failure
        if: failure()
        run: |
          echo "The refresh did not publish. The live page keeps its previous prices and date stamp, which is intended on any doubt." >> $GITHUB_STEP_SUMMARY
          echo "Look at the failing step. Usual causes: source page changed shape, source unreachable, or the layout is wrong." >> $GITHUB_STEP_SUMMARY
