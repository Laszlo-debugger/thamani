name: Probe sources
# Manual only. Changes nothing. Reports which price sources GitHub's runners can
# actually reach, so the refresh can be pointed at one that works.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Try each source
        run: |
          python - <<'PY'
          import re, socket, requests
          UA = "Mozilla/5.0 (compatible; ThamaniBuild/1.0)"
          URLS = [
            "https://afx.kwayisi.org/nse/",
            "https://rich.co.ke/rcdata/nsestocks.php",
            "https://www.african-markets.com/en/stock-markets/nse/listed-companies",
            "https://africanfinancials.com/company/ke-ncba/",
            "https://africanfinancials.com/company/ke-kegn/",
            "https://www.nse.co.ke/",
            "https://live.mystocks.co.ke/",
          ]
          TICKS = ("SCOM","EQTY","KCB","COOP","KEGN","KPLC","NCBA","BAT","EABL","DTK")
          for u in URLS:
              host = u.split("/")[2]
              try:
                  ips = sorted({a[4][0] for a in socket.getaddrinfo(host, 443)})
              except Exception as e:
                  ips = [f"dns fail {type(e).__name__}"]
              try:
                  r = requests.get(u, headers={"User-Agent": UA}, timeout=25)
                  body = r.text
                  hits = sum(1 for t in TICKS if t in body)
                  dates = re.findall(r"[A-Z][a-z]+ \d{1,2},? \d{4}|\d{1,2} [A-Z][a-z]{2} \d{4}", body)[:3]
                  print(f"OK   {r.status_code}  {len(body):>8} bytes  tickers {hits}/10  dates {dates}  {u}")
              except Exception as e:
                  print(f"FAIL {type(e).__name__}: {str(e)[:110]}  {u}")
              print(f"       dns -> {ips[:4]}")
          PY
