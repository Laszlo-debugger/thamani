<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Every counter on the Nairobi Securities Exchange, measured against what the government pays risk-free. Not investment advice.">
<meta name="robots" content="index,follow">
<meta property="og:title" content="Thamani">
<meta property="og:description" content="The Nairobi exchange, read against the risk-free rate. Enter your goal and your amount.">
</head>
<body>
<title>Thamani &mdash; the Nairobi exchange, read honestly</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>

*{box-sizing:border-box;margin:0}
:root{
--ink0:#08080a;--ink1:#0f0f13;--ink2:#16161b;--ink3:#1d1d24;--line:#26262e;--line2:#33333d;
--gd:#c98500;--gdb:#e5a32c;--gdt:#f0c968;--bl:#3987e5;
--r1:#7a570d;--r2:#a06e13;--r3:#c58619;--r4:#e5a32c;
--tp:#f2f0ec;--ts:#a5a09a;--tm:#726d66;
--ok:#4cc98e;--wn:#e8a83c;--bd:#ef8078;
--disp:'Fraunces',ui-serif,Georgia,serif;
--txt:'Archivo',ui-sans-serif,-apple-system,'Segoe UI',sans-serif;
--mono:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
--hdr:60px;--sub:34px}
html{background:var(--ink0)}
body{background:var(--ink0);color:var(--tp);font:15px/1.55 var(--txt);-webkit-font-smoothing:antialiased;
padding-bottom:64px}
@media(min-width:900px){body{padding-bottom:0}}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--disp)}
::selection{background:rgba(229,163,44,.28)}

/* ══ header ══ */
.hd{position:sticky;top:0;z-index:40;height:var(--hdr);border-bottom:1px solid var(--line);
background:rgba(8,8,10,.94);backdrop-filter:blur(14px);display:flex;align-items:center;gap:14px;
padding:0 14px}
.bmk{display:flex;align-items:baseline;gap:9px;flex:0 0 auto}
.bmk b{font-family:var(--disp);font-size:25px;font-weight:600;letter-spacing:-.02em;
background:linear-gradient(100deg,var(--gdt),var(--gd) 62%,#8d6010);
-webkit-background-clip:text;background-clip:text;color:transparent}
.bmk s{text-decoration:none;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--tm)}
.nav{display:none;gap:2px;margin-left:8px}
@media(min-width:900px){.nav{display:flex}}
.nav a{padding:8px 13px;font-size:13.5px;color:var(--ts);border-radius:7px;transition:.14s}
.nav a:hover{color:var(--tp);background:var(--ink2)}
.nav a.on{color:var(--gdt);background:var(--ink2)}
.sbox{position:relative;margin-left:auto;flex:1 1 auto;max-width:290px;min-width:0}
.sbox input{width:100%;height:36px;padding:0 12px 0 32px;border-radius:8px;background:var(--ink2);
border:1px solid var(--line);color:var(--tp);font:13px var(--mono);outline:none;transition:.14s}
.sbox input:focus{border-color:#4a3406}
.sbox input::placeholder{color:var(--tm)}
.sbox svg{position:absolute;left:10px;top:10px;width:15px;height:15px;stroke:var(--tm);fill:none;stroke-width:2}
.stat{display:none;flex:0 0 auto;text-align:right;font:11px/1.5 var(--mono);color:var(--tm)}
@media(min-width:1250px){.stat{display:block}}
.age{display:inline-block;padding:2px 9px;border-radius:999px;font:700 10.5px var(--mono);
border:1px solid var(--line2);background:var(--ink2)}
.age.f{color:var(--gdt);border-color:#4a3406}.age.s{color:#f0a;border-color:#4a2028;background:#1b1216}

/* ══ ticker strip ══ */
.tape{height:var(--sub);border-bottom:1px solid var(--line);background:var(--ink1);
display:flex;align-items:center;gap:22px;padding:0 14px;overflow-x:auto;scrollbar-width:none}
.tape::-webkit-scrollbar{display:none}
.tape div{display:flex;align-items:baseline;gap:7px;white-space:nowrap;font-family:var(--mono);font-size:11px}
.tape k{color:var(--tm);letter-spacing:.09em;text-transform:uppercase;font-size:9.5px}
.tape v{color:var(--tp);font-weight:500}
.tape c{padding:1px 6px;border-radius:4px;font-size:10px;border:1px solid transparent}
.up{color:var(--ok)}.dn{color:var(--bd)}.fl{color:var(--tm)}
.tape c.g{color:var(--gdt);background:rgba(201,133,0,.12);border-color:#3d2f0d}

/* ══ layout ══ */
.wrap{max-width:1680px;margin:0 auto}
.desk{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line)}
@media(min-width:1100px){.desk{grid-template-columns:296px 1fr 316px}}
.pane{background:var(--ink0);min-width:0}
.stick{position:sticky;top:calc(var(--hdr) + var(--sub))}
.page{padding:22px 16px 60px}
h1.pt{font-family:var(--disp);font-size:31px;font-weight:600;letter-spacing:-.022em;margin:2px 0 6px;
text-wrap:balance}
h2.st{font-family:var(--disp);font-size:22px;font-weight:600;letter-spacing:-.015em;margin:0 0 4px}
.eyb{font:700 9.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--gd)}
.lede{color:var(--ts);font-size:14px;max-width:68ch;line-height:1.62;margin:0 0 18px}
section{margin-bottom:34px}

/* ══ cards ══ */
.card{background:var(--ink1);border:1px solid var(--line);border-radius:13px;padding:18px 20px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(292px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(138px,1fr))}
.kpi{background:var(--ink2);border:1px solid var(--line);border-radius:11px;padding:14px 15px}
.kpi v{display:block;font-family:var(--disp);font-size:27px;font-weight:600;letter-spacing:-.03em;
line-height:1.06;color:var(--gdt)}
.kpi k{display:block;font:700 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;
color:var(--tm);margin-top:7px;line-height:1.45}
.kpi n{display:block;font-size:11.5px;color:var(--ts);margin-top:5px;line-height:1.5}
.kpi.w v{color:#f09a92}.kpi.c v{color:#6fa8ee}

/* ══ callouts ══ */
.co{border-left:3px solid var(--gd);background:rgba(201,133,0,.07);padding:13px 16px;
border-radius:0 9px 9px 0;font-size:14px;line-height:1.62;margin:13px 0}
.co.r{border-color:#9a3a34;background:rgba(154,58,52,.09)}
.co.b{border-color:var(--bl);background:rgba(57,135,229,.08)}

/* ══ watchlist ══ */
.wl{border-bottom:1px solid var(--line);padding:13px 14px}
.wlh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.wlh b{font:700 9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gd)}
.gchips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.gchips::-webkit-scrollbar{display:none}
.gchip{white-space:nowrap;padding:5px 10px;border-radius:999px;border:1px solid var(--line);
background:var(--ink1);font:700 10px var(--mono);letter-spacing:.06em;color:var(--tm);transition:.14s}
.gchip:hover{border-color:#4a3406;color:var(--gdt)}
.gchip.on{background:var(--gd);border-color:var(--gd);color:#0a0a0c}
.wlist{max-height:calc(100vh - var(--hdr) - var(--sub) - 190px);overflow-y:auto}
@media(max-width:1099px){.wlist{max-height:460px}}
.row{display:flex;align-items:center;gap:11px;width:100%;padding:11px 14px;text-align:left;
border-bottom:1px solid var(--ink2);border-left:2px solid transparent;transition:.12s}
.row:hover{background:var(--ink1)}
.row.on{background:var(--ink2);border-left-color:var(--gd)}
.row.off{display:none}
.ring{flex:0 0 34px;width:34px;height:34px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring i{position:absolute;inset:0;display:grid;place-items:center;font:700 10.5px var(--mono);font-style:normal}
.rmid{flex:1 1 auto;min-width:0}
.rtk{display:flex;align-items:center;gap:7px}
.rtk b{font:700 12px var(--mono);letter-spacing:.03em}
.rtk s{text-decoration:none;font-size:11px;color:var(--tm);overflow:hidden;text-overflow:ellipsis;
white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.rpx{display:flex;align-items:baseline;gap:7px;margin-top:2px;font-family:var(--mono);font-size:11px;color:var(--ts)}
.rpx em{font-style:normal;padding:1px 5px;border-radius:4px;font-size:10px}
.rend{flex:0 0 auto;text-align:right}
.vd{font:700 9px var(--mono);letter-spacing:.09em;padding:2px 6px;border-radius:4px;border:1px solid}
.vd.BUY{color:var(--ok);border-color:#1d4030;background:#10241a}
.vd.HOLD{color:var(--gdt);border-color:#3d2f0d;background:#1c1710}
.vd.AVOID{color:var(--bd);border-color:#4a2020;background:#211213}
.vd.NA{color:var(--tm);border-color:var(--line);background:var(--ink2)}

/* ══ tables ══ */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:top;text-align:right}
th{position:sticky;top:0;z-index:2;background:var(--ink1);font:700 9px var(--mono);letter-spacing:.08em;
text-transform:uppercase;color:var(--tm);vertical-align:bottom;border-bottom:1px solid var(--gd)}
th:first-child,td:first-child{text-align:left}
td.tx{text-align:left;font-size:11.5px;color:var(--ts);line-height:1.5;max-width:340px}
tbody tr:hover{background:var(--ink1);cursor:pointer}
tr.dim td{opacity:.4}tr.dim:hover td{opacity:1}
tr.off{display:none}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font:700 10px var(--mono);
border:1px solid transparent;white-space:nowrap}
.pill.ok{color:var(--ok);background:#10241a;border-color:#1d4030}
.pill.gd{color:var(--gdt);background:#1c1710;border-color:#3d2f0d}
.pill.wn{color:var(--wn);background:#1f1808;border-color:#4a3406}
.pill.bd{color:var(--bd);background:#211213;border-color:#4a2020}
.pill.na{color:var(--tm);background:var(--ink2);border-color:var(--line)}
.gt{text-align:center!important;letter-spacing:1.5px;white-space:nowrap;font-family:var(--mono)}
.pa{color:var(--ok);font-weight:700}.fa{color:#5c3b3b;font-weight:700}
.chip{display:inline-block;padding:2px 7px;border-radius:5px;font:700 10px var(--mono);
background:var(--ink2);border:1px solid var(--line);color:var(--gdt);margin:2px 4px 2px 0}

/* ══ dossier ══ */
.dhd{border-bottom:1px solid var(--line);background:var(--ink1);padding:18px 20px}
.dtop{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-start}
.dname{font-family:var(--disp);font-size:27px;font-weight:600;letter-spacing:-.022em;line-height:1.15}
.dmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:5px;
font:11px var(--mono);color:var(--tm)}
.dpx{text-align:right}
.dpx b{font-family:var(--disp);font-size:29px;font-weight:600;letter-spacing:-.03em}
.verd{border:1px solid;border-radius:12px;padding:15px 17px;margin:14px 0}
.verd.BUY{border-color:#1d4030;background:rgba(76,201,142,.07)}
.verd.HOLD{border-color:#3d2f0d;background:rgba(201,133,0,.07)}
.verd.AVOID{border-color:#4a2020;background:rgba(239,128,120,.06)}
.verd.NA{border-color:var(--line);background:var(--ink2)}
.verd h4{font-family:var(--disp);font-size:19px;font-weight:600;line-height:1.3}
.verd p{font-size:13.5px;color:var(--ts);line-height:1.62;margin-top:7px}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px;margin:12px 0}
.gate{background:var(--ink2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.gate b{display:block;font:700 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tm)}
.gate s{text-decoration:none;display:block;font-size:12.5px;margin-top:4px}
.gate.p{border-color:#1d4030}.gate.f{border-color:#3a2020}

/* ══ news / legal / debt ══ */
.item{background:var(--ink1);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.ihd{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:8px}
.iwho{font:700 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gd)}
.iage{margin-left:auto;font:10.5px var(--mono);color:var(--tm);white-space:nowrap}
.item h3{font-family:var(--disp);font-size:17.5px;font-weight:600;line-height:1.34;letter-spacing:-.01em}
.item p{font-size:12.5px;color:var(--ts);line-height:1.6;margin-top:7px}
.imp{border-top:1px solid var(--line);margin-top:11px;padding-top:9px;font-size:12px;color:var(--gdt)}

/* ══ goal gate ══ */
.gate-ov{position:fixed;inset:0;z-index:90;background:rgba(8,8,10,.93);backdrop-filter:blur(16px);
display:grid;place-items:center;padding:16px;overflow-y:auto}
.gate-bx{width:100%;max-width:800px;background:var(--ink1);border:1px solid #3a2c0c;border-radius:17px;
padding:26px 28px;box-shadow:0 0 90px rgba(201,133,0,.16)}
.gate-bx h2{font-family:var(--disp);font-size:33px;font-weight:600;letter-spacing:-.025em;
line-height:1.06;margin:8px 0 8px}
.gopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:11px;margin:20px 0 16px}
.gopt{text-align:left;background:var(--ink2);border:1px solid var(--line);border-radius:12px;
padding:15px 16px;transition:.15s;display:flex;flex-direction:column;align-items:stretch;
justify-content:flex-start}
.gopt:hover{border-color:#4a3406;background:#191813}
.gopt.on{border-color:var(--gd);background:#1d1a11}
.gopt>b{display:block;font-family:var(--disp);font-size:16.5px;font-weight:600}
.gopt.on>b{color:var(--gdt)}
.gopt>s{text-decoration:none;display:block;font-size:12px;color:var(--tm);margin-top:4px;line-height:1.5}
.gopt>i{font-style:normal;display:inline-block;align-self:flex-start;margin-top:auto;margin-top:9px;font:700 9.5px var(--mono);
letter-spacing:.1em;color:var(--tm)}
.gopt.on>i{color:var(--gd)}
.gbtn{width:100%;padding:13px;border-radius:999px;font:700 11px var(--mono);letter-spacing:.16em;
background:var(--gd);color:#0a0a0c;transition:.15s}
.gbtn:disabled{background:var(--ink3);color:var(--tm);cursor:not-allowed}
.gbtn:not(:disabled):hover{background:var(--gdb)}

/* ══ bottom nav ══ */
.bn{position:fixed;left:0;right:0;bottom:0;z-index:45;border-top:1px solid var(--line);
background:rgba(8,8,10,.96);backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(5,1fr)}
@media(min-width:900px){.bn{display:none}}
.bn a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
min-height:60px;font:700 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tm)}
.bn a.on{color:var(--gdt)}
.bn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}

.lgd{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:11.5px;color:var(--tm);margin-top:12px;align-items:center}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.foot{font-size:11.5px;color:var(--tm);line-height:1.72;border-top:1px solid var(--line);
padding-top:18px;margin-top:10px}
.sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(188px,1fr));gap:12px}
.smc{background:var(--ink2);border:1px solid var(--line);border-radius:11px;padding:12px 13px}
.smc h5{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:600}
.smc h5 s{text-decoration:none;font:9.5px var(--mono);color:var(--tm)}
.smc f{display:flex;justify-content:space-between;align-items:baseline;font:10.5px var(--mono);
color:var(--tm);margin-top:3px}
.smc f b{font-size:14px}

/* ══ amount: header control, gate input, quick buttons ══ */
.amt{flex:0 0 auto;display:none;align-items:baseline;gap:8px;padding:6px 12px;border-radius:8px;
background:var(--ink2);border:1px solid var(--line);transition:.15s;text-align:left}
@media(min-width:760px){.amt{display:flex}}
.amt:hover{border-color:#4a3406;background:#191813}
.amt k{font:700 8.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tm)}
.amt v{font:600 13px var(--mono);color:var(--gdt);white-space:nowrap}
.amtin{width:100%;height:64px;padding:0 20px;border-radius:13px;background:var(--ink2);
border:1px solid var(--line2);color:var(--gdt);font:600 30px var(--mono);letter-spacing:-.01em;
outline:none;transition:.15s}
.amtin:focus{border-color:var(--gd);background:#1a1811;box-shadow:0 0 0 4px rgba(201,133,0,.12)}
.amtin::placeholder{color:var(--tm);font-weight:400;font-size:22px}
.qamt{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 20px}
.qb{padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--ink2);
color:var(--ts);font:600 12.5px var(--mono);transition:.14s}
.qb:hover{border-color:#4a3406;background:#191813;color:var(--gdt)}
.qb.on{background:var(--gd);border-color:var(--gd);color:#0a0a0c}
.gexp{margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.gexp p{font-size:12px;line-height:1.62;color:var(--ts);margin:0 0 7px}
.gexp p:last-child{margin-bottom:0}
.gexp b{display:inline;font-family:var(--txt);font-size:12px;color:var(--tp);font-weight:700}
.gexp p>b:first-child{color:var(--gdt)}
.gopt.on .gexp{border-color:#4a3406}

/* ══ the notice. Deliberately not styled to be ignorable. ══ */
.dsc{border:1px solid #4a3406;border-radius:11px;background:#171205;
padding:14px 16px;font-size:12.5px;line-height:1.66;color:var(--ts)}
.dsc b{color:var(--gdt);font-weight:700}
.dsc-top{margin:0 0 20px}
.dsc-band{margin:26px 0 34px;background:#121317;border-color:var(--line2)}
.dsc-band b{color:var(--tp)}
.dsc-who{display:block;margin-top:9px;font:10.5px var(--mono);color:var(--tm);
letter-spacing:.04em}
@media(max-width:900px){.dsc-band{margin-bottom:84px}}

571,"rsi":null,"rat":"\u2014","sentiment_asof":"2026-08-20","flag":null,"note":"Loses 2.62 a share. 17,000 traded.","price_asof":"2026-08-20","pe":null,"dy":null,"mcap":0.34,"rsiu":false,"scwhy":{"income":"you cannot buy it at this size","growth":"you cannot buy it at this size","safety":"you cannot buy it at this size, which is the opposite of safe"},"to":17080,"net":0.0,"real":-6.49,"g":[false,false,false,false,true],"pct":7611.2,"sc":{"income":null,"growth":null,"safety":null}}],"macro":[["NSE market value","3.996 tn","+1.30% on the week, 3.62bn short of 4 trillion"],["Banking index","276.63","+2.83% &mdash; banks were 55.38% of all weekly turnover"],["NASI","238.13","+1.30%"],["Weekly turnover","3.92 bn","&minus;5.62%. Volume fell 25.61% to 100.09m shares"],["Foreign flows","&minus;1.17 bn","Net sellers in all five sessions, double the prior week. Locals 76.2% of turnover"],["Central Bank Rate","8.75%","Held for a fourth consecutive meeting, 11 August"],["Inflation","6.49%","July 2026 &mdash; the bar every return must clear"],["364-day T-bill","9.037%","7.68% after the 15% tax. No stockbroker needed"],["182-day T-bill","8.950%",""],["91-day T-bill","8.773%",""],["Infrastructure bonds","tax exempt","Three reopened issues drew a record 460.4bn of bids against a 150bn target"],["Lending rate","14.38%","June 2026"],["Savings rate","3.32%","Loses 3.17% a year in real terms"],["Shilling","129.49","Reserves USD 15.25bn, 6.3 months import cover"]],"cal":[["Mon 24 Aug","Market reopens","Next trading day.","hot"],["~Tue 25 Aug","Last buy for the NCBA dividend","T+3 settlement makes this the final realistic day to own it before book closure.","hot"],["Thu 27 Aug","Jubilee Holdings","Results expected on or before.",""],["Fri 28 Aug","NCBA and BAT book closure","Own before this date to receive the dividend. Britam and NSE results also expected.","hot"],["Mon 31 Aug","KCB \u00b7 Co-op \u00b7 NCBA \u00b7 I&M \u00b7 Stanbic","<b>Statutory deadline &mdash; all five must report.</b> As of 23 August none had. Anyone buying them now is buying before the number.","hot"],["Tue 1 Sep","Stanbic ex-dividend","",""],["~24 Sep","Unga Group","Full year to June.",""],["30 Sep","Kenya Power","Full year to June. The foreign-exchange question gets answered.",""],["30 Oct","KenGen","Full year to June.",""],["Oct 2026","KCB first bond tranche","100bn target.",""]],"macroK":{"infl":6.49,"cbr":8.75,"t364":9.037,"tbn":7.68,"order":1300000,"gate":13000000,"divt":0.05,"intt":0.15,"stamp":"2026-08-21T17:00:00+03:00","news":"2026-08-23T12:00:00+03:00"},"news":[{"d":"21 Aug 2026","who":"NCBA Group","head":"Interim dividend of 3.75 a share, register closes 28 August","body":"Payment 8 September. Against the 2.25 interim paid in 2024 this is <b>67% higher</b>. The declaration came before the half-year results, which were still due by 31 August &mdash; so the dividend was raised into a profit figure the market had not seen. Three other listed companies raised dividends into <i>falling</i> profit in the same fortnight, so the pattern is worth holding in mind until the number appears.","tk":"NCBA"},{"d":"17 Aug 2026","who":"Car &amp; General","head":"Interim dividend of 1.00 a share, register closes 3 September","body":"Payment 10 September. On a share around 375 that is 0.27%. Car &amp; General is up roughly tenfold in a year; the dividend is not the reason anyone is holding it, and 78% of its profit is a share of Watu Credit, which publishes no accounts.","tk":"CGEN"},{"d":"29 Jul 2026","who":"British American Tobacco","head":"Interim dividend of 10.00 a share, register closes 28 August","body":"Payment 25 September. The biggest per-share payment here, and the reason this counter tops every yield table in the country. Its payout ratio is <b>134%</b> &mdash; it is distributing more than it earns, which is funded by borrowing or by selling something, and cannot continue indefinitely.","tk":"BAT"},{"d":"21 Aug 2026","who":"Market","head":"Friday's session was missing from this page until now","body":"Prices here were stamped Thursday 20 August. A check on 23 August found a Friday 21 August session: <b>Co-operative Bank &minus;6.19% to 36.35</b>, Kenya Power &minus;2.33% to 20.95, KenGen &minus;1.33% to 11.15, Safaricom &minus;0.95% to 36.35, NCBA +0.28% to 90.50. Six counters were updated. For the rest the only source reachable was <i>older</i> than what this page already held, so it was left alone &mdash; a price is only replaced by one with a later date on it.","tk":null},{"d":"2026-08-21","who":"BOC Kenya","head":"Five-year profit streak ends &mdash; and the dividend goes up 60%","body":"H1 profit fell 39.8% to KSh 100.4m, revenue &minus;17.2% to KSh 600m, pre-tax &minus;37.4%. Overheads rose 17.3% to KSh 190.8m on fuel and energy. Interim dividend nonetheless raised 60% to KSh 4.00 &mdash; the highest in the series. Operating cash flow did improve 40.3% to KSh 236.3m, cash KSh 1.29bn.","tk":"BOC"},{"d":"2026-08-20","who":"Family Bank","head":"Maiden results: profit +62%, but the engine is Treasury bills","body":"PAT KSh 3.70bn, H1 EPS 2.23 from 1.75. Net interest income 6.95bn&rarr;9.78bn. Loans +10% to 111.06bn; government securities <b>+55% to 94.10bn</b>. Deposits +20% to 180.22bn on flat interest expense. Liquidity ratio 53.1%&rarr;61.3%. Due to other banks +198% to 4.54bn. <b>Gross NPLs +19% to 18.14bn.</b> Provisions 663.5m&rarr;998.3m. Assets +24% to 238.93bn, equity 33.22bn.","tk":"F"},{"d":"2026-08-19","who":"Equity Group","head":"Record KSh 45.5bn, and the best asset-quality swing of the cycle","body":"Attributable PAT 43.7bn (+31.5%); group 45.5bn (+32%). Total income +25% to 124.9bn. Assets +20% to 2.16tn. <b>NPL ratio 13.7% &rarr; 9.5%.</b> Regional subsidiaries now 52% of banking assets, 42% of PAT. <b>No interim dividend</b> &mdash; capital retained for expansion.","tk":"EQTY"},{"d":"2026-08-19","who":"Diamond Trust","head":"Pre-tax +37% on cheaper funding","body":"H1 pre-tax 9.84bn. PAT 6.4bn. Total operating income +21% to 26.5bn from 21.9bn. Net interest income +26%. Double-digit loan growth. Reported six days earlier than the estimated date &mdash; the share had already run 14% on triple volume.","tk":"DTK"},{"d":"2026-08-19","who":"KCB Group","head":"300bn borrowing programme, first 100bn tranche by October","body":"Five-year medium-term note programme, subject to regulatory approval, alongside a new sustainability bond framework launched at the KCB Leadership Centre. <b>This is debt, not equity &mdash; no dilution to shareholders.</b> It signals intent to lend materially more, and it means a KCB bond will shortly exist as a fixed-income alternative.","tk":"KCB"},{"d":"2026-08-19","who":"Car &amp; General","head":"Front page calls it speculative retail","body":"Business Daily attributes the rally to &ldquo;speculative retail investors&rdquo;. Market value up from KSh 2.65bn to KSh 27.41bn in twelve months &mdash; a 936% increase, about KSh 24.76bn of new paper wealth. The quiet phase is over.","tk":"CGEN"},{"d":"2026-08-18","who":"Standard Chartered","head":"Profit &minus;17%, dividend raised anyway, no payment date","body":"Interim dividend lifted to KSh 8.50 from 8.00 while half-year profit fell 17%. Trailing EPS is down 42.19% and the payout ratio stands at 99%. No timeline for the payment was disclosed.","tk":"SCBK"},{"d":"2026-08-18","who":"Absa Bank Kenya","head":"Profit &minus;10%, dividend +150%, and the parent's buyout failed","body":"H1 PAT KSh 10.53bn, down from 11.6bn as rate cuts squeezed income. Interim dividend raised 150% to a record KSh 0.50. Net loans a record 329.87bn. Separately the South African parent sought 895.9m shares at KSh 34.50 to reach 85%; only 189.38m came in &mdash; a <b>21.1% take-up</b>. Stake rose to 71.99%, not the 85% intended. Over 64,000 minority holders declined.","tk":"ABSA"},{"d":"2026-08-19","who":"Kenya Airways","head":"Wider losses, and a plan to open hospitals","body":"Fuel costs +72%, fleet grounded, intra-Africa routes suspended and frequencies cut. Management's revival strategy is diversification into healthcare, hospitality and education, plus spinning off the maintenance unit.","tk":"KQ"},{"d":"2026-08-17","who":"Crown Paints","head":"Record half-year &mdash; on weaker cash","body":"Revenue +13.1% to KSh 8.38bn, net profit +11.2% to a record KSh 486m, pre-tax +25.5% to 688m, margin 7.4%&rarr;8.2%. <b>But net operating cash flow fell 40.9% to 681m</b> and current liabilities rose to 6.05bn from 4.87bn. Assets +19.1% to 10.63bn. KSh 1.56bn now sunk in a loss-making Tanzanian unit. No interim dividend.","tk":"CRWN"},{"d":"2026-08-17","who":"Nation Media Group","head":"Revenue at a 21-year low","body":"Broadcasting and digital growth insufficient to offset print collapse; losses widened.","tk":"NMG"},{"d":"2026-08-14","who":"Market","head":"Foreigners sold in all five sessions while the index rose","body":"NSE market cap +1.30% to KSh 3.996tn, 3.62bn short of 4 trillion. Banking index +2.83% to 276.63; banks were 55.38% of weekly turnover. <b>Turnover fell 5.62% to 3.92bn and volume fell 25.61% to 100.09m shares.</b> Foreign investors were net sellers of KSh 1.17bn &mdash; more than double the prior week &mdash; in every session. Locals were 76.2% of turnover.","tk":"MKT"},{"d":"2026-08-11","who":"Central Bank","head":"Rate held at 8.75% for a fourth straight meeting","body":"CBK cited stable inflation and exchange rate against elevated global energy risk, and noted declining commercial lending rates supporting private-sector credit. Shilling KSh 129.40/USD, reserves USD 15.25bn, 6.3 months import cover. <b>Three reopened infrastructure bonds drew a record KSh 460.4bn of bids against a KSh 150bn target.</b> T-bills drew 40.8bn against 28bn offered.","tk":"MKT"}],"legal":[{"sev":"critical","tks":["KCB","NCBA","COOP"],"title":"DPP charges the chief executives of three of the largest banks","forum":"Director of Public Prosecutions","status":"Charged 5 Aug 2026","yr":"2026","body":"Charges brought under the Proceeds of Crime and Anti-Money Laundering Act, sections 5 and 44(2). <b>The individuals were charged, not the institutions</b> &mdash; a distinction that matters for the shares. But these three banks are roughly a quarter of this exchange's value and all three must publish half-year results within days.","impact":"Governance discount and headline risk, not a balance-sheet event. Watch whether any board makes a leadership change before results."},{"sev":"critical","tks":["KNRE"],"title":"Constitutional petition freezes twelve board appointments","forum":"High Court","status":"Order runs to 1 October 2026","yr":"2026","body":"Governance at the national reinsurer is unresolved by court order until October &mdash; arriving in the season when El Ni&ntilde;o flood and crop claims land on exactly this balance sheet.","impact":"Cannot make major decisions while frozen. Rated Buy, cheap on earnings, and structurally stuck."},{"sev":"elevated","tks":["DTK"],"title":"SIM-swap fraud judgment apportions the bank 40% liability","forum":"High Court &mdash; [2026] KEHC 9771 (KLR)","status":"Judgment delivered","yr":"2026","body":"The court apportioned Diamond Trust 40% of the loss, KES 1,788,601. Immaterial as a number against a 47bn market cap.","impact":"Precedent, not provision. Establishes bank co-liability in mobile-fraud losses &mdash; relevant to every bank with a mobile channel."},{"sev":"elevated","tks":["KCB"],"title":"Moving to take over Kilimani apartments in a 2bn dispute","forum":"High Court / administration","status":"Live","yr":"2026","body":"KCB placed the developer Northcote under administration and is moving on the security. Ordinary recovery action for a bank of this size.","impact":"Recovery timing, not solvency. Included because it is live and disclosed."},{"sev":"watch","tks":[],"title":"Tribunal: KRA cannot deny VAT deductions on supplier red flags alone","forum":"Tax Appeals Tribunal","status":"Ruled","yr":"2026","body":"A taxpayer-favourable ruling limiting the Revenue Authority's ability to disallow input VAT purely because a supplier looks irregular. Relevant to any listed company carrying contested assessments.","impact":"Mildly positive across the market for contingent tax liabilities."},{"sev":"watch","tks":[],"title":"EPZ firm loses a 390m appeal on burden of proof","forum":"Tax Appeals Tribunal","status":"Decided against taxpayer","yr":"2026","body":"The company could not prove KRA had received its objection letter. The claim failed on procedure, not merit.","impact":"A reminder that tax contingencies in annual reports turn on paperwork, not argument."},{"sev":"watch","tks":["ABSA"],"title":"Parent's tender offer fails to reach its target","forum":"Corporate action, not litigation","status":"Closed at 21.1% take-up","yr":"2026","body":"Absa Group sought 895.9m shares at KSh 34.50 to lift its stake to as much as 85%. Only 189.38m came in. The stake rose to <b>71.99%</b>, not 85%. Over 64,000 minority holders declined to sell &mdash; in a bank whose half-year profit had just fallen 10%.","impact":"Free float stays wider than the parent intended. Read the refusal as minority holders expecting more than 34.50 &mdash; the share closed at 36.00."}],"debt":[{"tk":"KCB","name":"KCB Group","head":"300bn note programme, first 100bn tranche by October","body":"A five-year medium-term note programme, subject to regulatory approval, launched 19 August alongside a new sustainability bond framework.","read":"<b>This is debt, not shares.</b> Nobody's slice of KCB gets smaller &mdash; there is no dilution. It signals intent to lend materially more, and it means a KCB bond will exist by October as a fixed-income alternative.","sev":"watch"},{"tk":"F","name":"Family Bank","head":"Interbank borrowing up 198% to 4.54bn","body":"Balances due to other banks rose 198% to KSh 4.54bn. Government securities holdings 94.10bn against net loans of 111.06bn. Equity 33.22bn on assets of 238.93bn.","read":"Borrowing in the interbank market to fund a Treasury-bill carry trade. It works while rates hold and reverses when they fall &mdash; which is precisely what cut Absa's profit 10% this half.","sev":"elevated"},{"tk":"CRWN","name":"Crown Paints","head":"Current liabilities 6.05bn while cash conversion fell 41%","body":"Current liabilities rose to KSh 6.05bn from 4.87bn in the same half that operating cash flow fell 40.9% to 681m. KSh 1.56bn cumulative sunk into a loss-making Tanzanian subsidiary, 791.47m of it in 2025. Planned capex 141.24m at Lukenya.","read":"Rising short-term obligations against falling cash conversion is the combination that ends small manufacturers. Record profit does not offset it.","sev":"elevated"},{"tk":"ABSA","name":"Absa Bank Kenya","head":"Record loan book of 329.87bn, and profit still fell","body":"Net loans and advances reached a record KSh 329.87bn, up 8%, while half-year profit fell 10% to 10.53bn as rate cuts compressed margin.","read":"Growing the book into a falling-rate environment did not protect earnings. That is the read-across to every bank still to report.","sev":"watch"},{"tk":"SLAM","name":"Sanlam Kenya","head":"Borrowings cut to 1.44bn from 4.37bn","body":"Borrowings down to KSh 1.44bn from 4.37bn at June 2024. Solvency ratio 266%. But pre-tax profit fell 28.1%, the insurance service result 34.5%, and investment returns 83.3%.","read":"The balance sheet was repaired. The earnings engine was not. Deleveraging is not a thesis on its own.","sev":"watch"},{"tk":"EQTY","name":"Equity Group","head":"Assets 2.16 trillion, bad loans 13.7% to 9.5%","body":"Total assets expanded 20% to KSh 2.16tn. The non-performing loan ratio fell from 13.7% to 9.5%. Regional subsidiaries are now 52% of banking assets and 42% of profit.","read":"<b>The best asset-quality improvement of this cycle.</b> On a balance sheet this size, a 4.2-point NPL fall is worth more than any dividend on this exchange.","sev":"clear"},{"tk":"KQ","name":"Kenya Airways","head":"Fuel costs up 72%, fleet grounded","body":"Fuel costs rose 72%. Aircraft grounded, intra-Africa routes suspended, frequencies cut. Losing KSh 120.31 per share.","read":"No debt disclosure changes this picture. The stated revival plan is diversification into hospitals, hotels and education.","sev":"critical"},{"tk":"BOC","name":"BOC Kenya","head":"Cash flow rose 40% while profit fell 40%","body":"Operating cash flow improved 40.3% to KSh 236.3m and cash reserves reached 1.29bn &mdash; in the half where net profit fell 39.8% to 100.4m and a five-year growth streak ended.","read":"The rare inverse of the Crown Paints problem: worse profit, better cash. Of the two, better cash is the one you want.","sev":"watch"}],"divup":[{"n":"Standard Chartered","t":"SCBK","p":-17.0,"d":6.25,"x":"8.00 &rarr; 8.50, no payment date given"},{"n":"Absa Bank Kenya","t":"ABSA","p":-10.0,"d":150.0,"x":"0.20 &rarr; 0.50, a record"},{"n":"BOC Kenya","t":"BOC","p":-39.8,"d":60.0,"x":"2.50 &rarr; 4.00, highest in the series"}],"goaldoc":{"income":{"t":"Income now","one":"You want money arriving in your account.","mean":"Twice a year most listed companies send cash to shareholders. That is a dividend. It lands in your bank account and you can spend it. This goal is about getting paid, not about getting rich.","accept":"The share price may go nowhere for years. You are buying a cheque, not a rocket.","kills":"<b>A dividend that is not covered by profit.</b> If a company earns 10 and pays out 13, it is borrowing or selling something to pay you. That gets cut &mdash; usually without warning. Three companies on this exchange did exactly this in the last week.","test":"Payout ratio under 90%, and the after-tax yield beating what the government pays you risk-free."},"growth":{"t":"Growth","one":"You want the price higher than you paid.","mean":"You buy at 90, you hope to sell at 140. Dividends are a bonus you barely notice. All of your return comes from someone later paying more than you did.","accept":"No cash for years, and the real possibility of being wrong for a long time while holding.","kills":"<b>Buying growth that already happened.</b> A share up 400% has already been discovered. And profit that will not repeat &mdash; a currency gain, a one-off sale, a share of a company that publishes no accounts.","test":"Earnings actually growing, at a price that has not already priced it in, and profit that repeats."},"safety":{"t":"Safety first","one":"You want your money back, plus a bit.","mean":"You would rather make 8% you can rely on than 40% you might. You are protecting what you have more than you are building.","accept":"You will watch other people make more than you, and it will be uncomfortable.","kills":"<b>Buying something you cannot sell.</b> A share nobody trades has a price on the screen and no buyer when you need one. And a dividend funded by borrowing rather than profit.","test":"Covered dividend, real daily trading, price not already stretched, and income that at least keeps pace with inflation."},"preserve":{"t":"I cannot afford to lose it","one":"This is money you actually need.","mean":"Rent. School fees. The money that stands between you and a crisis. If it halved, something in your life would break.","accept":"Nothing. That is the point. This goal does not accept losses.","kills":"<b>The stock market itself.</b> Any share can fall 30% in a month for reasons that have nothing to do with the company. There is no share on this exchange that is safe in the way this goal needs.","test":"This page will not recommend a share for this goal. It will show you where the money should go instead, and the numbers for that."}},"edu":[{"k":"Years of profit","also":"Price to earnings, or P/E","s":"If it says 6, the company earns back what you paid in about six years at today's rate of profit.","l":"Lower looks cheaper. But cheap often means the market expects that profit to fall &mdash; so a very low number is a question, not a bargain. Kenya Power sits at 1.65 on this exchange, and that is a warning rather than a gift, because its profit comes from currency movements on dollar debt rather than from selling electricity."},{"k":"Earnings per share","also":"EPS","s":"Of all the profit the company made, this is the slice sitting behind one share.","l":"If a company earns 14.50 per share and the share costs 90, you are paying about 6.2 years of profit. Watch for the word <i>attributable</i> &mdash; group profit includes slices belonging to partners in other countries, and that part is not yours."},{"k":"Dividend","also":"Yield","s":"Cash the company sends you, shown as a percentage of what the share costs today.","l":"A 7.78% dividend on a 90-shilling share means about 7 shillings a year per share. It is paid in cash, usually twice a year, and it is the only return that does not depend on someone else buying your shares later."},{"k":"Payout ratio","also":"Dividend cover","s":"Of every 100 shillings the company earns, how much it hands to shareholders.","l":"Under 70 is comfortable. Over 100 means it is paying out more than it earns &mdash; funded by borrowing or by selling something &mdash; and that cannot continue. <b>BAT on this exchange pays 134%. Standard Chartered pays 99% with earnings down 42%.</b> Those are the two highest yields here and both are countdowns."},{"k":"Tax on your return","also":"Withholding tax","s":"Kenya takes 5% of share dividends and 15% of interest on government paper.","l":"This changes which option actually wins, and almost nobody adjusts for it. A 7.96% dividend nets 7.56%. A 9.037% Treasury bill nets 7.68%. The share <i>looks</i> higher and is actually lower. Infrastructure bonds are exempt entirely, which is why they get three times oversubscribed."},{"k":"The risk-free rate","also":"What doing nothing pays","s":"The government will pay you 9.037% to lend it money for a year, with no risk of the company failing.","l":"After its 15% tax that is 7.68%. This is the bar. <b>If a share pays you less than 7.68% in dividends, you are taking company risk for free</b> &mdash; the only reason left to own it is a belief the price will rise. Every yield on this page is measured against this line."},{"k":"Real return","also":"After inflation","s":"Prices in Kenya rose 6.49% in the year to July. Your return has to beat that before you are actually ahead.","l":"A savings account paying 3.32% loses you 3.17% a year in what your money can buy. You feel richer and get poorer. Every income figure on this page is also shown after inflation, because that is the only version that is true."},{"k":"Traded in a day","also":"Liquidity","s":"The price on the screen only exists for the number of shares people are actually trading.","l":"This is the one beginners never hear about and it costs the most. If your order is larger than a day's trading, you push the price up against yourself and pay more than the screen says. When you sell, the same in reverse &mdash; and there may be nobody there. <b>Of 57 counters here, most cannot absorb even a modest order.</b> Enter your amount above and the page marks which ones can."},{"k":"Momentum","also":"RSI","s":"How hard the price has run recently. Above 70 means the crowd already arrived.","l":"It does not mean the price will fall. It means you are not early, and the easy part is behind you. Right now <b>eleven counters here are overbought and none are oversold</b> &mdash; there is nowhere on this exchange you can buy something the crowd has abandoned."},{"k":"Earnings quality","also":"Is the profit real","s":"Profit can come from selling things, or from a one-off that will not happen again.","l":"A currency gain on dollar debt. A property revaluation. A share of another company's profit. The first kind repeats and is worth paying for; the others are not. <b>Car &amp; General looks cheap on forward earnings, but 78% of its profit is a share of Watu Credit, which publishes no accounts and whose own profit fell 85% in the 2024 floods.</b>"},{"k":"Cash conversion","also":"Profit versus cash","s":"Whether the profit on paper actually turned into money in the bank.","l":"Always put these two next to each other. Crown Paints just posted a record half-year profit while its operating cash flow <b>fell 40.9%</b> &mdash; the sales are real but the money has not arrived. That gap is the single most useful check an ordinary investor can make, and it takes one minute."},{"k":"Book closure","also":"Ex-dividend date","s":"The deadline to own a share if you want its next dividend.","l":"You must be on the register before that date. And a trade takes three working days to settle, so the last realistic day to buy is roughly three working days earlier. Miss it by a day and you wait a year."},{"k":"Reading news against the numbers","also":"Why ratios lie","s":"Every ratio on every screen is backward-looking. News is what changes the price.","l":"This is the lesson that cost the most. A screen showed a share at 12 years of profit while its results, published the day before, had tripled the profit &mdash; making it 5.8 years. <b>The ratio was not wrong, it was late.</b> On this page every counter's verdict states what the news does to the numbers, because the numbers alone would have told you to walk past it."}],"newsread":{"EQTY":{"dir":"up","t":"The news makes this better than the ratios say","b":"Reported 19 August: profit to shareholders <b>43.7bn, up 31.5%</b>, and bad loans fell from <b>13.7% to 9.5%</b>. On a 2.16 trillion balance sheet a 4.2-point fall in bad loans is worth more than any dividend on this exchange. Annualise the half-year and you are paying about <b>4.0 years of profit</b>, not the 4.72 the trailing screen shows.","c":"But there is <b>no interim dividend</b> &mdash; the cash is being kept for expansion &mdash; and the share is overbought after a 5% week. You are buying the better bank at a stretched price with no cash until next year."},"DTK":{"dir":"up","t":"The news explains the volume","b":"Reported 19 August: pre-tax profit <b>+37% to 9.84bn</b>, interest income +26%, total income +21%. It reported <b>six days earlier than the estimated date</b> &mdash; which is why the share ran 14% the week before on triple normal volume. Somebody knew.","c":"The figure is the <i>group</i>. Diamond Trust has real minority partners in Tanzania, Uganda and Burundi, so the slice belonging to you is smaller than the headline. And the news is now in the price &mdash; momentum 83.8."},"SCBK":{"dir":"down","t":"The news destroys the yield","b":"Reported 18 August: profit <b>&minus;17%</b>. Trailing earnings per share are down <b>42%</b>. It pays out <b>99% of what it earns</b> &mdash; and raised the interim dividend to 8.50 anyway, <b>with no payment date disclosed</b>.","c":"That 9.00% is the highest apparently-safe income on this exchange and the least safe number on this page. The share fell 5.5% on the day. <b>A screen sorting by yield puts this near the top. Do not let it.</b>"},"ABSA":{"dir":"down","t":"The news contradicts the price","b":"Reported 18 August: profit <b>fell 10%</b> to 10.53bn as rate cuts squeezed income &mdash; and the share <b>rose 4%</b> into overbought territory two days later. It raised the interim dividend 150% to a record 0.50 anyway.","c":"Separately the South African parent tried to buy 895.9m shares at 34.50 to reach 85%. Only <b>21.1%</b> came in; the stake went to 71.99%. <b>Over 64,000 small holders refused cash</b> in a bank whose profit is falling. Read that as the crowd expecting more, not as a valuation."},"BOC":{"dir":"down","t":"The news ends a five-year story","b":"Reported 21 August: profit <b>&minus;39.8% to 100.4m</b>, revenue &minus;17.2%, and a <b>five-year run of first-half profit growth ended</b>. Overheads rose 17.3% on fuel and energy. The interim dividend was still raised <b>60% to 4.00</b> &mdash; the third company in one week to do that.","c":"One genuine positive: operating cash flow rose 40.3% to 236.3m and cash reached 1.29bn. Worse profit, better cash &mdash; of the two, better cash is the one you want. But the payout is now 80% of a shrinking number."},"F":{"dir":"down","t":"The news explains where the growth came from, and it is not banking","b":"Reported 20 August: profit <b>+62% to 3.70bn</b>. Then look at the engine. Loans grew <b>10%</b> while holdings of government securities jumped <b>55% to 94.10bn</b>. Deposits rose 20% while interest costs stayed flat. <b>It is a leveraged Treasury-bill fund with a banking licence.</b> Non-interest income actually fell.","c":"And bad loans rose <b>19% to 18.14bn &mdash; 16.3% of its loan book</b>, against Equity's 9.5%. You would pay 1.65 times book for that, with <b>no dividend</b>, to access a trade you can do yourself risk-free. It closed at 33.00, below the 37 it touched."},"CGEN":{"dir":"mixed","t":"The news is now the story, and that is the warning","b":"Half-year profit <b>2.60bn, up 309%</b>. On 80.2m shares that annualises to about <b>5.8 years of profit</b> &mdash; not expensive at all. One year: <b>+1,066%</b>. Market value went from 2.65bn to 27.41bn.","c":"On 19 August the national business paper put it on the front page and attributed the rally to <b>&ldquo;speculative retail investors&rdquo;</b>. And <b>78% of that profit is a share of Watu Credit's earnings</b> &mdash; an associate that publishes no accounts, whose own profit collapsed 85% in the 2024 floods. El Ni&ntilde;o rains are forecast for October. You cannot audit four-fifths of the profit."},"KPLC":{"dir":"down","t":"The cheapest number here is the biggest warning","b":"It earns <b>12.76 per share</b> on a 21.45 price &mdash; 1.65 years of profit, the cheapest on the exchange. The dividend is covered <b>11.6 times</b>. Rated Buy, genuinely liquid, not overbought. On paper the best thing here.","c":"But Kenya Power's profit swings on <b>foreign-exchange gains on its dollar debt</b>, not on selling electricity. When the shilling strengthens it books enormous paper gains straight through the income statement. Same category as Car &amp; General's associate income: real in the accounts, not repeatable. Up 88% in a year. <b>Full-year results land 30 September and could look entirely different.</b>"},"KCB":{"dir":"mixed","t":"Overbought before the number, and a new borrowing programme","b":"Launched a <b>300bn medium-term note programme</b> on 19 August, first tranche 100bn targeted by October. Read this correctly: <b>it is debt, not new shares.</b> Nobody's slice gets smaller. It signals intent to lend materially more.","c":"But it is <b>overbought at 84.8 before it has reported</b>, and it must publish by 31 August. Its chief executive was among three charged by the DPP on 5 August. You would be buying a stretched price ahead of a number you have not seen."},"NCBA":{"dir":"up","t":"Quietly the last one standing","b":"It <b>drifted down while every other large bank rose</b>. It is the only liquid large bank that is <b>not overbought</b>, its 7.78% dividend is <b>covered 2.1 times</b>, and it trades 30.7m a day. <b>Book closure 28 August.</b>","c":"It has not reported yet &mdash; the figures land by 31 August. Earnings growth is only 8.3%, the weakest of the big banks. And its chief executive was among three charged on 5 August. The dividend also nets <b>7.39% against a 7.68% Treasury bill</b>, so on income alone you are still behind."},"TOTL":{"dir":"down","t":"Correcting my own earlier screens","b":"I called this the overlooked one: 8% dividend, earnings up 46%, not overbought, nobody talking about it.","c":"<b>The dividend is not covered.</b> Payout is 104% &mdash; it pays out more than it earns. That is the same defect as BAT, on a smaller company. And it traded 3m in a day. Withdraw the earlier read."},"SBIC":{"dir":"mixed","t":"The right answer you cannot have","b":"The <b>only counter on this exchange whose covered dividend beats the Treasury bill after tax</b> &mdash; 8.22% net against 7.68%, covered 1.47 times, and not overbought. On the numbers alone it wins outright.","c":"It traded <b>7,170 shares</b>. Under 2m shillings in a full day. Enter almost any real amount above and this fails the access gate. <b>The best income on the exchange sits behind a door most people cannot fit through.</b>"},"CARB":{"dir":"down","t":"Nothing was announced","b":"Up 25% in days, and 7.74% on the last session alone.","c":"Momentum <b>95.4 &mdash; the most overbought reading on the exchange &mdash; on volume 13.3 times normal, with no announcement of any kind</b>. No results, no dividend news, nothing. This is the single most dangerous chart on this page and there is no information behind it."},"CRWN":{"dir":"mixed","t":"Record profit, worse cash","b":"Reported 17 August: best half-year on record. Revenue 8.38bn (+13.1%), profit 486m (+11.2%), pre-tax margin up to 8.2%. The recovery runs 37m &rarr; 75m &rarr; 437m &rarr; 486m across four first halves.","c":"<b>Operating cash flow fell 40.9% to 681m</b> and current liabilities rose to 6.05bn from 4.87bn. Profit up, cash down. It also traded 618,000 shillings, so at most real order sizes it is academic anyway."},"KQ":{"dir":"down","t":"The plan is the red flag","b":"Losing <b>120.31 per share</b>. Fuel costs up 72%, aircraft grounded, intra-Africa routes suspended.","c":"Management's stated revival strategy is to <b>diversify into healthcare, hospitality and education</b> and spin off the maintenance unit. An airline that cannot fly profitably is not fixed by opening a hospital."},"KEGN":{"dir":"up","t":"The quiet one that holds up","b":"Highest <b>covered</b> dividend you can realistically buy &mdash; 7.96% gross, covered 1.8 times, rated Buy, <b>not overbought</b>, and 15.4m traded a day. El Ni&ntilde;o rains fill the dams, and water is free fuel where diesel is not.","c":"It sells almost everything to one customer &mdash; Kenya Power &mdash; which has a history of owing it money. Government holds about 70%. And results are not until <b>30 October</b>, so you would hold ten weeks blind. Nets 7.56% against a 7.68% Treasury bill."},"SCOM":{"dir":"mixed","t":"The only one your order is invisible in","b":"Traded <b>561m in a single day</b> &mdash; more than the next two counters combined. Half the market's value. Earnings up 37%, payout 63% and covered, rated Strong buy.","c":"15.4 years of profit, and the dividend nets <b>3.92%</b> &mdash; barely half the Treasury bill. You would be buying it for growth and for the ability to get out, not for income."},"EABL":{"dir":"down","t":"Somebody large is leaving","b":"Earnings up 45% on trailing figures.","c":"It carries <b>the only Sell rating on this exchange</b>, and on the last session it traded <b>256m &mdash; 7.8 times normal volume &mdash; and fell</b>. Heavy volume on a falling price with a Sell rating is distribution, not accumulation."},"SLAM":{"dir":"down","t":"Growing the top line while the profit shrinks","b":"Premiums up 32%, solvency 266%, borrowings cut to 1.44bn from 4.37bn.","c":"Pre-tax profit <b>&minus;28.1%</b>, insurance service result <b>&minus;34.5%</b>, investment returns <b>&minus;83.3%</b>, and a 147.5m net financial loss. The balance sheet was repaired. The earnings engine was not."},"NMG":{"dir":"down","t":"Revenue at a 21-year low","b":"Broadcasting and digital subscriptions are growing.","c":"Not fast enough. Group revenue is at its <b>lowest level in 21 years</b> as print collapses, and losses widened."},"COOP":{"dir":"mixed","t":"A source conflict you must settle yourself","b":"Earnings up 27%, 6.75 years of profit, and 50m traded a day &mdash; genuinely liquid.","c":"<b>The dividend figure disagrees across sources.</b> One implies 2.50 per share (6.44%), another has 3.00 (7.74% here, and 8.12% at Friday's intraday low of 36.95). At 3.00 it clears the Treasury bill; at 2.50 it does not. <b>Check the last dividend notice before you size this.</b> It is also overbought and has not reported yet."},"KNRE":{"dir":"down","t":"Cheap, liquid, and structurally stuck","b":"5.18 years of profit, rated Buy, and 4.2m traded &mdash; cheap on the face of it.","c":"Earnings are <b>falling 11.6%</b>, a court order has <b>frozen twelve board appointments until 1 October</b>, and a forecast El Ni&ntilde;o is about to land flood and crop claims on the national reinsurer. Cheap for reasons."},"BAT":{"dir":"down","t":"The biggest yield on the exchange is a countdown","b":"12.59% gross &mdash; nothing else here comes close. Earnings up 17%. Book closure 28 August.","c":"It pays out <b>134% of what it earns</b>. A dividend above profit is funded by borrowing or by selling something, and it gets cut. The only question is when."},"NSE":{"dir":"down","t":"A leveraged bet on the thing that just fell","b":"Earnings up 133%, though off a small base &mdash; it earns 1.04 per share.","c":"At 25.6 years of profit it is a leveraged bet on trading volumes &mdash; and <b>volumes fell 25.61% last week</b> while turnover fell 5.62%. You would be paying a high multiple for a business whose input is shrinking."},"TPSE":{"dir":"mixed","t":"Cheapest real business here, and unbuyable","b":"<b>3.68 years of profit with earnings up 197%</b> &mdash; the cheapest genuine business on this exchange.","c":"It traded <b>87,000 shillings</b> in a full day. And El Ni&ntilde;o rains hit safari tourism in the season it earns most. The valuation is real; the access is not."},"KPC":{"dir":"down","t":"Flat since listing, and that is the answer","b":"A 9-shilling share on a 165bn company. It looks cheap because the price is small.","c":"It earns <b>41 cents a share</b> &mdash; 22 years of profit &mdash; and has <b>declared no dividend at all</b>. Down 1.09% over twelve months. It has gone nowhere because it was priced fully at listing, not because the market is ignoring it. <b>A low share price is not a low valuation.</b>"},"UMME":{"dir":"down","t":"The trap that catches every yield screener","b":"393.65% dividend yield. The highest number on any screen of <script>
const D = window.__D, M = D.macroK, ICO = window.__ICO;
const GOALS = {
  income:{t:"Income now",s:"I want cash reaching my account",h:"after-tax dividend, whether it is covered by earnings, and whether it beats the risk-free rate"},
  growth:{t:"Growth",s:"I want the price to rise",h:"earnings growth against what you pay, penalising profit that will not repeat"},
  safety:{t:"Safety first",s:"I want to not lose money",h:"dividend coverage, liquidity, momentum, and whether it keeps pace with inflation"},
  preserve:{t:"I cannot afford to lose it",s:"This is money I need",h:"nothing on this exchange — see the answer"}
};
const IDX = {}; D.counters.forEach(c => IDX[c.tk] = c);

const A = ()=> AMT || M.order;
/* gate 1 and every score depend on YOUR amount, so they are computed here, not baked in */
function gates(c){
  const g1 = c.to >= A()*10;
  return [g1, c.g[1], c.g[2], c.g[3], c.g[4]];
}
function pctOfDay(c){ return c.to ? +(A()/c.to*100).toFixed(1) : null; }
function shares(c){ return Math.floor(A()/c.price); }
function scoreOf(c, goal){
  if (goal==="preserve") return null;
  const g = gates(c);
  if (!g[0]) return null;                      // access gate uses YOUR amount
  const s = c.sc[goal];
  return s;                                     // other gates unchanged
}

/* ── helpers ── */
const E = (s)=>String(s==null?"":s);

const mny=(v)=>v>=1e9?(v/1e9).toFixed(2)+"bn":v>=1e6?(v/1e6).toFixed(1)+"m":Math.round(v/1e3)+"k";
const chg=(c)=>c==null?"&mdash;":`<span class="${c>0?'up':c<0?'dn':'fl'}">${c>0?"+":""}${c.toFixed(2)}%</span>`;
const hrs=(iso)=>(Date.now()-new Date(iso).getTime())/36e5;

const fmtA=()=>{const v=A();return v>=1e6?"KES "+(v/1e6).toFixed(v%1e6?2:1)+"m":"KES "+v.toLocaleString()};
const ksh=(v)=>"KES "+Math.round(v).toLocaleString();
const tick=(b)=>b?'<i class="pa">&#10003;</i>':'<i class="fa">&#10007;</i>';

function verdict(c, goal){
  const g = goal || "safety";
  if (g === "preserve") return {v:"NA", why:"On this goal nothing on the exchange qualifies. See the Desk."};
  const s = scoreOf(c, g);
  if (s == null){
    if (!gates(c)[0]) return {v:"NA", why:`<b>Fails the access gate.</b> A full day of trading is ${mny(c.to)} — your ${fmtA()} would be ${pctOfDay(c)}% of it. You would push the price up against yourself buying, and find nobody there selling.`};
    if (g==="income") return {v:"NA", why:"No covered dividend, so it cannot answer an income goal."};
    if (g==="growth") return {v:"NA", why:"No published earnings, so growth cannot be assessed."};
    return {v:"NA", why:"Fails an earlier gate — see the gate panel."};
  }
  const band = g==="income" ? [70,45] : g==="growth" ? [25,12] : [15,5];
  const v = s >= band[0] ? "BUY" : s >= band[1] ? "HOLD" : "AVOID";
  return {v, s, why:null};
}

function ring(c, goal){
  const g = goal==="preserve"||!goal ? "safety" : goal;
  const raw = scoreOf(c, g);
  const cap = g==="income"?90:g==="growth"?40:35;
  const pct = raw==null ? 0 : Math.max(0, Math.min(1, raw/cap));
  const col = raw==null ? "#3a3a44" : pct>.72 ? "#e5a32c" : pct>.42 ? "#c98500" : "#8a5a2a";
  const dash = (2*Math.PI*15*pct).toFixed(1);
  return `<div class="ring"><svg viewBox="0 0 34 34" width="34" height="34">
<circle cx="17" cy="17" r="15" fill="none" stroke="#20202a" stroke-width="2.6"/>
<circle cx="17" cy="17" r="15" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round"
 stroke-dasharray="${dash} 200"/></svg><i style="color:${col}">${raw==null?"–":Math.max(0,Math.round(raw))}</i></div>`;
}

/* momentum: three states, not two. A reading, calm, or NOT VERIFIED.
   An unverified reading must never render as calm — that is the failure mode
   that makes a stale page look current. */
function rsiPill(c){
  if(c.rsiu) return '<span class="pill wn" title="Momentum could not be re-checked">not verified</span>';
  if(c.rsi==null) return '<span class="pill ok">calm</span>';
  return `<span class="pill ${c.rsi>=90?'bd':c.rsi>=80?'wn':'gd'}">${Math.round(c.rsi)}</span>`;
}
function rsiWords(c){
  if(c.rsiu) return "Momentum has not been re-checked since the reading was taken, so it is not counted. Treat the timing of this one as unknown rather than as safe.";
  if(c.rsi==null) return "Below 70 &mdash; the crowd has not piled in";
  return c.rsi>=90 ? "Severely overbought" : "Overbought &mdash; you would be arriving after the move";
}

/* ── charts ── */
function spark(vals, w=170, h=54){
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(hi===lo) hi=lo+1;
  const pad=(hi-lo)*.18; lo-=pad; hi+=pad;
  const n=vals.length, X=i=>6+i*(w-12)/(n-1), Y=v=>h-8-(v-lo)/(hi-lo)*(h-18);
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const z = lo<0&&0<hi ? `<line x1="6" y1="${Y(0).toFixed(1)}" x2="${w-6}" y2="${Y(0).toFixed(1)}" stroke="#2b2b33" stroke-dasharray="2 3"/>`:"";
  const dots=vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===n-1?4:2.3}" fill="${i===n-1?'#c98500':'#a06e13'}" stroke="#16161b" stroke-width="2"><title>${D.tlabels[i]}: ${v>0?"+":""}${v.toFixed(1)}%</title></circle>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${z}<polyline points="${pts}" fill="none" stroke="#c98500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
function spark3(vals, labels, w=170, h=54){
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(hi===lo) hi=lo+1;
  const pad=(hi-lo)*.18; lo-=pad; hi+=pad;
  const n=vals.length, X=i=>6+i*(w-12)/(n-1), Y=v=>h-8-(v-lo)/(hi-lo)*(h-18);
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const dots=vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===n-1?4:2.6}" fill="${i===n-1?'#c98500':'#a06e13'}" stroke="#16161b" stroke-width="2"><title>${labels[i]}: ${v.toFixed(2)}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
<polyline points="${pts}" fill="none" stroke="#c98500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
function fiveYear(){

  const fellFirst = ks.filter(k=>D.hist[k].e<0).length;
  const panels = ks.map(k=>{const h=D.hist[k];
    return `<a class="smc" href="#/stock/${k}"><h5>${h.n}<s>${k}</s></h5>${spark3([h.a,h.b,h.c],L)}
<f><span>${h.a.toFixed(2)} &rarr; ${h.c.toFixed(2)}</span><b class="${h.t>0?'up':'dn'}">${h.t>0?"+":""}${Math.round(h.t)}%</b></f>
<div style="font:9.5px var(--mono);color:var(--tm);margin-top:2px">2021&ndash;24 ${h.e>0?"+":""}${Math.round(h.e)}% &middot; 2024&ndash;26 ${h.l>0?"+":""}${Math.round(h.l)}%</div></a>`}).join("");
  const rows = ks.map(k=>{const h=D.hist[k], then=Math.floor(A()/h.a)*h.c;
    return `<tr onclick="location.hash='#/stock/${k}'"><td><b>${h.n}</b> <span style="color:var(--tm);font:10.5px var(--mono)">${k}</span></td>
<td class="mono">${h.a.toFixed(2)}</td><td class="mono" style="color:var(--tm)">${h.b.toFixed(2)}</td><td class="mono"><b>${h.c.toFixed(2)}</b></td>
<td class="mono ${h.e>0?'up':'dn'}">${h.e>0?"+":""}${h.e.toFixed(0)}%</td>
<td class="mono ${h.l>0?'up':'dn'}">${h.l>0?"+":""}${h.l.toFixed(0)}%</td>
<td class="mono ${h.t>0?'up':'dn'}"><b>${h.t>0?"+":""}${h.t.toFixed(0)}%</b></td>
<td class="mono ${then>A()?'up':'dn'}">${ksh(then)}</td></tr>`}).join("");
  return `<section style="margin-top:34px"><div class="eyb">Five years, and it is not a curve</div>
<h2 class="st">What ${hm.n} of these shares cost in 2021, in 2024, and now</h2>
<p class="lede">Three closes, ${hm.d1} to ${hm.d3} &mdash; four years and ten months. Every figure is the price printed on a page that stamped its own trading date, and I checked both pages myself rather than taking one reading. <b>The line between the dots is not data.</b> It is drawn so you can see the shape; the price did things in between that no source available here recorded.</p>
<div class="grid g4" style="margin:14px 0 4px">
<div class="kpi"><v>${grew}/${hm.n}</v><k>Worth more than in 2021</k></div>
<div class="kpi w"><v>${fellFirst}</v><k>Fell over the first three years</k></div>

<div class="kpi c"><v>${Math.round(worst.t)}%</v><k>${worst.n}, worst of the ${hm.n}</k></div></div>
<div class="sm" style="margin-top:12px">${panels}</div>
<div class="card" style="margin-top:16px"><div class="scroll"><table>
<thead><tr><th>Company</th><th>${hm.d1}</th><th>${hm.d2}</th><th>${hm.d3}</th><th>To 2024</th><th>Since 2024</th><th>Whole period</th><th>${fmtA()} then, now</th></tr></thead>

function bars(series,w=430,h=190){

/* ══ YOUR POSITION — the whole point of asking the amount ══ */
function position(c){
  const n = shares(c), cost = n*c.price, left = A()-cost;
  const grossDiv = c.dy ? cost*c.dy/100 : 0;
  const netDiv = grossDiv*(1-M.divt);
  const tb = A()*M.t364/100*(1-M.intt);
  const better = netDiv - tb;
  const ok = gates(c)[0];
  return `<section style="margin-top:4px"><div class="eyb">Your money in this one</div>
<h2 class="st">What ${fmtA()} actually buys here</h2>
<div class="card"><div class="scroll"><table><tbody>
<tr><td>Shares you could buy</td><td class="mono"><b>${n.toLocaleString()}</b></td><td class="tx">At ${c.price.toFixed(2)} each. ${left>0?ksh(left)+" left over — you cannot buy a part of a share":""}</td></tr>
<tr><td>What you would spend</td><td class="mono">${ksh(cost)}</td><td class="tx">Before your broker's commission, which is typically around 1.7% on small orders in Kenya</td></tr>
<tr><td>Your order as a share of one day</td><td class="mono ${ok?'up':'dn'}"><b>${pctOfDay(c)}%</b></td><td class="tx">${ok?"Under 10%, so you can buy without moving the price against yourself":"<b>Over 10% of a day's trading.</b> Your own buying would push the price up, and when you sell there may be nobody there. This is the gate most people never hear about."}</td></tr>
${c.dy?`<tr><td>Dividend, one year, in shillings</td><td class="mono">${ksh(grossDiv)}</td><td class="tx">${c.dy.toFixed(2)}% of what you spent. Paid as cash, usually twice a year</td></tr>
<tr><td>After the ${M.divt*100}% tax</td><td class="mono"><b>${ksh(netDiv)}</b></td><td class="tx">What actually reaches your bank account</td></tr>`
:`<tr><td>Dividend</td><td class="mono"><span class="fl">none</span></td><td class="tx">This company pays nothing. Your entire return depends on selling to someone later at a higher price</td></tr>`}
<tr><td>The same money in a Treasury bill</td><td class="mono">${ksh(tb)}</td><td class="tx">${M.t364}% for 364 days, less the ${M.intt*100}% tax. Government obligation, and you do not need a stockbroker for it</td></tr>
<tr style="border-top:2px solid var(--line2)"><td><b>Difference</b></td><td class="mono"><b class="${better>0?'up':'dn'}">${better>0?"+":""}${ksh(better)}</b></td>
<td class="tx"><b>${better>0?`You would earn ${ksh(better)} more in income here than in a Treasury bill.`:`You would earn ${ksh(-better)} <b>less</b> in income here than in a Treasury bill &mdash; and carry company risk for it. The only reason left to buy is a belief the price rises.`}</b></td></tr>
</tbody></table></div></div></section>`;
}

/* ══ WHAT THE NEWS DOES TO THE NUMBERS ══ */
function newsRead(c){
  const r = D.newsread[c.tk];
  if(!r) return `<section><div class="co"><b>No material news on file for this counter.</b> The verdict above rests on the ratios alone &mdash; and ratios are always backward-looking. Treat it as less reliable than a counter where the news is known.</div></section>`;
  const ic = r.dir==="up"?"ok":r.dir==="down"?"bd":"gd";
  const lab = r.dir==="up"?"News improves the case":r.dir==="down"?"News damages the case":"News cuts both ways";
  return `<section style="margin-top:22px"><div class="eyb">Read this before the ratios</div>
<h2 class="st">${r.t}</h2>
<div class="item" style="border-color:${r.dir==='down'?'#4a2020':r.dir==='up'?'#1d4030':'#3d2f0d'}">
<div class="ihd"><span class="pill ${ic}">${lab}</span></div>
<p style="font-size:13.5px;color:var(--tp)">${r.b}</p>
<div class="imp" style="color:var(--ts)"><b style="color:var(--gdt)">And the other side:</b> ${r.c}</div></div>
<div class="co b" style="font-size:13px"><b>Why this section exists.</b> Every ratio on this page is backward-looking. The news is what moves the price. A screen once showed a share at 12 years of profit while its results, published the day before, had tripled the profit &mdash; making it 5.8. The ratio was not wrong, it was late.</div></section>`;
}

/* ══ VERIFIED PRICE POINTS — real, dated, no invented lines ══ */
function priceHistory(c){
  const p = D.prices[c.tk];
  if(!p) return `<section><h2 class="st">Price history</h2><div class="co b"><b>No verified price history for this counter.</b> Five years of daily prices for the Nairobi exchange are not obtainable from the sources this page was built from &mdash; and rather than draw a line I cannot stand behind, there is nothing here. A stockbroker's terminal or the exchange's own historical data will give it to you. <b>Any page showing you a smooth five-year curve for all 57 counters is almost certainly generating it.</b></div></section>`;
  const vals = p.map(x=>parseFloat(x[1].replace(/,/g,"")));
  const lo=Math.min(...vals), hi=Math.max(...vals);
  const h = D.hist[c.tk];
  const arc = h ? `<div class="grid g2" style="margin:4px 0 14px">

<tr><td>First three years, to Nov 2024</td><td class="mono ${h.e>0?'up':'dn'}">${h.e>0?"+":""}${h.e.toFixed(0)}%</td></tr>
<tr><td>Since Nov 2024</td><td class="mono ${h.l>0?'up':'dn'}">${h.l>0?"+":""}${h.l.toFixed(0)}%</td></tr>
<tr><td>${fmtA()} at the 2021 price, worth today</td><td class="mono ${Math.floor(A()/h.a)*h.c>A()?'up':'dn'}"><b>${ksh(Math.floor(A()/h.a)*h.c)}</b></td></tr>

<div style="font:11px/1.6 var(--mono);color:var(--tm);margin-top:8px">Price only. Dividends paid over those years are on top of this, and not counted here.</div></div></div>` : "";
  return `<section><h2 class="st">Price history &mdash; every point verified and dated</h2>
<p class="lede">These are the prices I could confirm with a date and a source. Not a modelled curve. The gap between them is real time in which the price did things nobody recorded here.</p>

<div class="card"><div class="scroll"><table><thead><tr><th>When</th><th>Price</th><th>Move from first</th><th class="tx">What this point is</th></tr></thead><tbody>
${p.map((x,i)=>{const v=vals[i], d=(v/vals[0]-1)*100;
return `<tr><td class="mono" style="white-space:nowrap;color:var(--gdt)">${x[0]}</td><td class="mono"><b>${x[1]}</b></td>
<td class="mono">${i===0?'<span class="fl">&mdash;</span>':`<span class="${d>0?'up':'dn'}">${d>0?'+':''}${d.toFixed(0)}%</span>`}</td>
<td class="tx">${x[2]}</td></tr>`}).join("")}
</tbody></table></div>
<div style="margin-top:12px;font:11px var(--mono);color:var(--tm)">Range across verified points: ${lo.toFixed(2)} to ${hi.toFixed(2)} &mdash; a spread of ${((hi/lo-1)*100).toFixed(0)}%.</div></div></section>`;
}

  return `<section style="margin-top:22px"><div class="eyb">Dated cash</div>

<div class="card"><div class="scroll"><table><tbody>
<tr><td>Declared</td><td class="mono">${d.declared}</td><td class="tx">${d.src}</td></tr>
<tr><td>On the register by</td><td class="mono" style="color:var(--gdt)"><b>${d.record}</b></td><td class="tx">Own the shares before this date or you get nothing. Three working days to settle, so buy about three working days earlier</td></tr>
<tr><td>Money reaches you</td><td class="mono"><b>${d.pay}</b></td><td class="tx">Paid as cash into your account</td></tr>
<tr><td>On your ${fmtA()}</td><td class="mono">${ksh(gross)}</td><td class="tx">${n.toLocaleString()} shares &times; ${d.amt.toFixed(2)}. That is ${pctPrice.toFixed(2)}% of what you pay for the share, for this one payment</td></tr>
<tr style="border-top:2px solid var(--line2)"><td><b>After the ${M.divt*100}% tax</b></td><td class="mono"><b>${ksh(net)}</b></td><td class="tx"><b>This is the only figure on this page that is a declared amount on a stated date rather than a trailing average.</b></td></tr>

<div class="co" style="margin-top:12px">${d.note}</div></div></section>`;

<h2 class="st">Dividends actually declared, and when the money moves</h2>

<tbody>${ks.map(tk=>{const d=nd[tk], c=IDX[tk], n=shares(c), net=n*d.amt*(1-M.divt);
return `<tr onclick="location.hash='#/stock/${tk}'"><td><b>${c.name}</b> <span style="color:var(--tm);font:10.5px var(--mono)">${tk}</span></td>

/* ══ a blank score is a measurement failure, and says which ══ */
function scoreGaps(c){
  const w = c.scwhy||{}, gaps = Object.keys(GOALS).filter(k=>k!=="preserve" && w[k]);
  if(!gaps.length) return "";
  return `<section style="margin-top:22px"><h2 class="st">What could not be scored here, and why</h2>
<div class="card"><table><tbody>${gaps.map(k=>
`<tr><td style="width:150px"><b>${GOALS[k].t}</b></td><td class="mono"><span class="pill wn">no score</span></td><td class="tx">${w[k]}</td></tr>`).join("")}

<div style="font:11px/1.6 var(--mono);color:var(--tm);margin-top:10px">A blank is not a low score. It means the question could not be answered from what is published, and a screen that prints a number anyway is inventing one.</div></div></section>`;

/* the newest close held by ANY counter — prices no longer share one date */
function newestClose(){
  const ds = D.counters.map(c=>c.price_asof).filter(Boolean).sort();
  return ds.length ? ds[ds.length-1] : D.macroK.stamp.slice(0,10);
}
function priceDateSpread(){
  const ds = [...new Set(D.counters.map(c=>c.price_asof).filter(Boolean))].sort();
  return ds;
}

/* ══ router ══ */
function route(){
  const h = (location.hash||"#/desk").replace(/^#\/?/,"") || "desk";
  const parts = h.split("/");
  const page = parts[0] || "desk";
  const app = document.getElementById("app");
  let body, chrome = true;
  if (page === "stock" && parts[1]) {
    body = `<div class="wrap"><div class="desk">${watchlist(parts[1])}${dossier(parts[1])}${wire(parts[1])}</div></div>`;
  } else if (page === "markets") { body = `<div class="wrap">${markets()}</div>`; }
  else if (page === "news")    { body = `<div class="wrap">${newsPage()}</div>`; }
  else if (page === "legal")   { body = `<div class="wrap">${legalPage()}</div>`; }
  else if (page === "debt")    { body = `<div class="wrap">${debtPage()}</div>`; }
  else if (page === "learn")   { body = `<div class="wrap">${learnPage()}</div>`; }
  else if (page === "method")  { body = `<div class="wrap">${methodPage()}</div>`; }
  else { body = `<div class="wrap"><div class="desk">${watchlist(null)}${deskCentre()}${wire(null)}</div></div>`; }
  app.innerHTML = header(page) + body + noticeBand() + bottomNav(page);
  if (!GOAL) app.insertAdjacentHTML("beforeend", goalGate("goal"));
  else if (!AMT) app.insertAdjacentHTML("beforeend", goalGate("amt"));
  wireUp();
  if (parts[0]==="stock") window.scrollTo(0,0);
}

function wireUp(){
  // staleness
  try{
    const hh = hrs(M.stamp), el = document.getElementById("age");
    if(el){ el.textContent = "Data " + age(hh); el.className = "age " + (hh<24?"f":"s"); }
  }catch(e){}
  document.querySelectorAll("[data-age]").forEach(s=>{
    try{ s.textContent = age(hrs(s.getAttribute("data-age")+"T09:00:00+03:00")); }catch(e){}
  });
  // search
  const q = document.getElementById("q");
  if(q) q.addEventListener("input", e=>{
    Q = e.target.value.trim().toLowerCase();
    document.querySelectorAll(".row[href]").forEach(r=>{
      const tk = r.getAttribute("href").split("/").pop();
      const c = IDX[tk];
      r.classList.toggle("off", !!Q && !(tk.toLowerCase().includes(Q)||c.name.toLowerCase().includes(Q)));
    });
    document.querySelectorAll("tbody tr[onclick]").forEach(r=>{
      const t = r.getAttribute("onclick").match(/stock\/(\w+)/);
      if(!t) return; const c = IDX[t[1]]; if(!c) return;
      r.classList.toggle("off", !!Q && !(c.tk.toLowerCase().includes(Q)||c.name.toLowerCase().includes(Q)));
    });
  });
  // goal chips
  document.querySelectorAll(".gchip").forEach(b=>b.addEventListener("click",()=>{
    GOAL = b.dataset.g; try{localStorage.setItem("th-goal",GOAL);}catch(e){}; route();
  }));
  // goal gate
  let pick = null;
  document.querySelectorAll(".gopt").forEach(b=>b.addEventListener("click",()=>{
    pick = b.dataset.pick;
    document.querySelectorAll(".gopt").forEach(x=>x.classList.toggle("on",x===b));
    const go = document.getElementById("gogo");
    go.disabled = false; go.textContent = "Enter as " + GOALS[pick].t.toLowerCase();
  }));
  const go = document.getElementById("gogo");
  if(go) go.addEventListener("click",()=>{
    if(!pick) return; GOAL = pick; try{localStorage.setItem("th-goal",GOAL);}catch(e){}; route();
  });
  // amount step
  const ain = document.getElementById("amtin"), ago = document.getElementById("amtgo");
  const parse = (s)=>parseFloat(String(s).replace(/[^0-9.]/g,""))||0;
  if(ain){
    ain.focus();
    const sync=()=>{ const v=parse(ain.value); ago.disabled = !(v>=1000);
      ago.textContent = v>=1000 ? "Open the terminal with "+(v>=1e6?"KES "+(v/1e6).toFixed(v%1e6?2:1)+"m":"KES "+v.toLocaleString()) : (v>0?"Minimum 1,000":"Enter an amount to continue"); };
    ain.addEventListener("input",()=>{ const v=parse(ain.value); ain.value = v? v.toLocaleString():""; sync(); });
    ain.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!ago.disabled) ago.click(); });
    document.querySelectorAll(".qb").forEach(b=>b.addEventListener("click",()=>{
      ain.value = (+b.dataset.amt).toLocaleString(); sync(); ain.focus(); }));
    sync();
  }
  if(ago) ago.addEventListener("click",()=>{
    const v = parse(document.getElementById("amtin").value);
    if(!(v>=1000)) return; AMT = v; try{localStorage.setItem("th-amt",String(v));}catch(e){}; route();
  });
  const ab = document.getElementById("amtbtn");
  if(ab) ab.addEventListener("click",()=>{ AMT=null; try{localStorage.removeItem("th-amt");}catch(e){}; route(); });
}
window.addEventListener("hashchange", route);
route();

</script>
